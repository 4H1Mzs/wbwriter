name: Release

# Runs only on version tags or manual dispatch — never on pull requests, because
# the job executes on a self-hosted Mac that holds the signing identity.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (e.g. v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (signed + notarized)
    # 4H1M org Mac: has the NDI SDK, Developer ID certificate and the
    # "WBWriter" notarytool keychain profile.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Build, sign and notarize
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          # The notary profile lives in the login keychain on the build Mac, so it works while the Mac is locked.
          VERSION="${RELEASE_TAG#v}" NOTARY_PROFILE=WBWriter \
            NOTARY_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db" scripts/build.sh

      - name: Verify
        run: |
          VERSION="${RELEASE_TAG#v}"
          codesign --verify --deep --strict build/WBWriter.app
          spctl --assess --type execute -vv build/WBWriter.app
          xcrun stapler validate "build/WBWriter-$VERSION.dmg"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          VERSION="${RELEASE_TAG#v}"
          NOTES=".github/release-notes/$RELEASE_TAG.md"
          ASSETS=()
          for f in build/WBWriter-$VERSION.dmg build/WBWriter-$VERSION.zip build/WBWriter-$VERSION.pkg; do
            [[ -f "$f" ]] && ASSETS+=("$f")
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            if [[ -f "$NOTES" ]]; then NOTE_ARGS=(--notes-file "$NOTES"); else NOTE_ARGS=(--generate-notes); fi
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" --title "WBWriter $VERSION" "${NOTE_ARGS[@]}" --latest
          fi
